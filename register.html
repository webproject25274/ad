<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>91CLUB » Register</title>
<style>
  :root{
    --bg-navy: #0b1220;
    --bg-navy-2: #0f1a2e;
    --gold: #f6cf5b;
    --gold-2: #ffe08a;
    --text-white: #f5f7fb;
    --text-muted: #b8c1d1;
    --border-gold: rgba(246, 207, 91, 0.55);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: radial-gradient(ellipse at top, var(--bg-navy-2) 0%, var(--bg-navy) 60%);
    color: var(--text-white);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 560px;
    width: 100%;
  }

  /* ---- Profile photo (edit: swap logo.jpg to change the picture) ---- */
  .avatar-wrap {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    padding: 4px;
    background: var(--gold);
    box-shadow: 0 0 45px 8px rgba(246, 207, 91, 0.45);
    margin-bottom: 36px;
  }

  .avatar-wrap img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: #1e293b;
  }

  /* ---- Title ---- */
  .title {
    font-size: clamp(2rem, 6vw, 2.75rem);
    font-weight: 800;
    line-height: 1.15;
    margin: 0 0 22px 0;
    letter-spacing: 0.5px;
  }

  .title .arrows {
    color: var(--gold);
  }

  /* ---- Subtitle ---- */
  .subtitle {
    font-size: 0.95rem;
    letter-spacing: 4px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 34px;
  }

  /* ---- CTA button ---- */
  .join-btn {
    display: inline-block;
    width: 100%;
    max-width: 420px;
    padding: 20px 0;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--gold-2), var(--gold));
    color: #1a1400;
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: 1px;
    text-decoration: none;
    text-transform: uppercase;
    text-align: center;
    box-shadow: 0 0 35px 4px rgba(246, 207, 91, 0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    border: none;
    cursor: pointer;
  }

  .join-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 45px 8px rgba(246, 207, 91, 0.55);
  }

  .join-btn:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 3px;
  }

  /* ---- Disclaimer box ---- */
  .disclaimer {
    margin-top: 46px;
    border: 1px solid var(--border-gold);
    border-radius: 14px;
    padding: 22px 26px;
    font-size: 0.95rem;
    line-height: 1.6;
    color: var(--text-white);
    max-width: 460px;
  }

  @media (max-width: 480px) {
    .avatar-wrap { width: 140px; height: 140px; }
    .join-btn { font-size: 1.1rem; padding: 17px 0; }
    .disclaimer { padding: 18px 20px; font-size: 0.88rem; }
  }
</style>
</head>
<body>

  <div class="card">

    <!-- Profile picture: replace logo.jpg in this folder to change it -->
    <div class="avatar-wrap">
      <img src="logo.jpg" alt="Profile picture">
    </div>

    <h1 class="title">
      91CLUB <span class="arrows">&raquo;</span> <span class="arrows">&raquo;</span><br>
      91CLUB Official
    </h1>

    <p class="subtitle">Join our community</p>

    <a href="#" class="join-btn" id="ctaBtn">Register Now</a>

    <div class="disclaimer">
      Educational and informational community content. No real-money gaming or betting is promoted on this page.
    </div>

  </div>

  <script>
    // Edit this to point the button at your actual registration/signup link
    const destination = "#"; // <-- put your registration link here
    document.getElementById('ctaBtn').addEventListener('click', function(e){
      if (destination === "#") {
        e.preventDefault();
        alert("Add your registration link in register.html (search for 'destination').");
      }
    });
  </script>

</body>
</html>
